<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdeMont</title>
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><!--enlaza la pagina de los iconos de redes-->
    <link rel="stylesheet" href="css/formularioContact.css">

    <!--Aqui nos conectamos con boostrap para que funcionen los iconos. header-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Aqui nos conectamos con boostrap JS para que funcione el Carrito Modal. header-->    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <special-header></special-header>

    <br>
    <br>
   <div class="titulo">
        <h1>Contactanos</h1>
   </div>

    
    <section class="formulario">
        <div class="inputs">
            <label for="fullname">Nombre</label>
            <input type="text" id="fullname" name="fullname" placeholder="Ingrese su nombre">
            <br>
            <label for="phone">Teléfono</label>
            <input type="number" id="phone" name="phone" placeholder="Ingrese su telefono">

            <br>
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico" required>

            <br>
            <label for="message">Mensaje</label>
            <textarea id="message" name="message" placeholder="Escriba su mensaje aquí" rows="5" required></textarea>
            
            <!-- Botón Enviar Mensaje -->  
             <!-- Comentario para indicar la sección del botón -->
            <button type="submit" class="send-button" onclick="openModal()">Enviar</button>  <!-- Crea un botón que envía el formulario y llama a la función `openModal` al hacer clic -->

            <!-- Modal -->  <!-- Comentario para indicar la sección del modal -->
            <dialog class="modal" id="mainModal" aria-labelledby="modalTitle">  <!-- Crea un diálogo modal con una clase para estilos y un ID único para manipulación en JavaScript -->
                <h1 id="modalTitle">Mensaje Enviado</h1>  <!-- Título del modal que describe el contenido -->
                <button class="bien" onclick="closeModal()">OK</button>  <!-- Botón dentro del modal que cierra el modal al hacer clic llamando a `closeModal` -->
            </dialog>

                <script>
                function openModal() {  // Define la función `openModal` que abre el modal//
                    const modal = document.getElementById('mainModal');  // Obtiene el elemento del modal por su ID //
                    modal.showModal(); // Abre el modal  <!-- Abre el modal usando el método `showModal` -->
                }

                function closeModal() {  //Define la función `closeModal` que cierra el modal//
                    const modal = document.getElementById('mainModal');  // Obtiene el elemento del modal por su ID//
                    modal.close(); // Cierra el modal  //Cierra el modal usando el método `close`//
                }
                </script>

        </div>

        <div class="datosContacto">

            <div class="redesContacto">
                <a href="https://www.facebook.com/?locale=es_LA" class="facebook" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://web.whatsapp.com/" class="whatsapp" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="https://www.instagram.com/" class="instagram" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://x.com/i/flow/login?input_flow_data=%7B%22requested_variant%22%3A%22eyJsYW5nIjoiZXMiLCJteCI6IjIifQ%3D%3D%22%7D" class="twitter" target="_blank"><i class="fa-brands fa-twitter"></i></a>          
            </div>

            <div class="infoContacto">
                <h2>Información de contacto</h2>
                <h3>Tienda en Bogotá</h3>
                <h3>Cra 78b # 39a 57 Sur</h3>
                <h3>PBX: 60(2)8333022</h3>
                <h3>Info@verdemont.com.co</h3>
            </div>    
        </div>
    </section>

    <br>
    <br>
    <special-footer></special-footer>  
    <!--Aqui conectamos el doc js con el html-->
    <script src="js/header-footer.js"></script>
    <script src="js/header-scroll.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/catalogo.js"></script>

</body>
</html>
