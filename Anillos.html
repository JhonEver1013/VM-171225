<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdeMont</title>
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><!--enlaza la pagina de los iconos de redes-->
    <link rel="stylesheet" href="css/productos-catalogo.css">
    <link rel="stylesheet" href="css/modeling-set.css">
    <link rel="stylesheet" href="css/animated-testimonials.css">

    <!--Aqui nos conectamos con boostrap para que funcionen los iconos. header-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Aqui nos conectamos con boostrap JS para que funcione el Carrito Modal. header-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jsPDF para generación de facturas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>
    <special-header></special-header>

    <div class="main-container">

      <!-- Columna derecha: catálogo + imagen -->
      <div class="catalog-right">

        <!-- Hero Section: 5 imágenes individuales con efecto tilt -->
        <div class="hero-models-grid mb-5">
          <div class="hero-model-item card-tilt">
            <img src="img/hero-model-1.png" alt="Modelo 1">
          </div>
          <div class="hero-model-item card-tilt">
            <img src="img/hero-model-2.png" alt="Modelo 2">
          </div>
          <div class="hero-model-item card-tilt">
            <img src="img/hero-model-3.png" alt="Modelo 3">
          </div>
          <div class="hero-model-item card-tilt">
            <img src="img/hero-model-4.png" alt="Modelo 4">
          </div>
          <div class="hero-model-item card-tilt">
            <img src="img/hero-model-5.png" alt="Modelo 5">
          </div>
        </div>

        <style>
          .hero-models-grid {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            width: 90%;
            margin: 0 auto;
            flex-wrap: wrap;
          }
          .hero-model-item {
            flex: 1;
            min-width: 120px;
            aspect-ratio: 4/5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
          }
          /* Jerarquía 1-3-5 Grande / 2-4 Pequeño */
          .hero-model-item:nth-child(1),
          .hero-model-item:nth-child(3),
          .hero-model-item:nth-child(5) {
            flex: 1.6;
          }
          .hero-model-item:nth-child(2),
          .hero-model-item:nth-child(4) {
            flex: 0.8;
          }
          .hero-model-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
          }
          @media (max-width: 768px) {
            .hero-model-item {
              flex: 1 1 45%;
            }
          }
        </style>

        <!-- Catálogo generado por JS -->
        <div class="catalog-container"></div>

      </div>

    </div>

    <!-- Nueva Sección Destacada: Esplendor en cada detalle con efecto Animated Testimonials -->
    <section class="rings-featured py-5">
        <div class="container">
            <h2 class="display-4 text-center mb-5" style="color: #008f39; font-weight: bold;">Esplendor en cada detalle</h2>
            <div class="animated-testimonials-container">
                <!-- Generado por js/animated-testimonials.js -->
            </div>
        </div>
    </section>

    <special-footer></special-footer>
    <!--Aqui conectamos el doc js con el html-->
    <script src="js/favoritos.js"></script>
    <script src="js/header-footer.js"></script>
    <script src="js/header-scroll.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/catalogo.js"></script>   <!-- si usas catalogo.js -->
    <script src="js/catalogo1.js"></script>  <!-- si usas catalogo1.js -->
    <script src="js/modeling-set.js"></script>
    <script src="js/animated-testimonials.js"></script>
    <script src="js/card-tilt.js"></script>

</body>
</html>
